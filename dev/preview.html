<!doctype html>
<!-- Browser preview harness for the chat dock web UI.

     Loads the real web assets with a stubbed pycmd that replays a canned
     event stream, so CSS/JS can be iterated in a plain browser without a
     disposable Anki. Serve the repo root (e.g. python3 -m http.server) and
     open /dev/preview.html; add ?night for dark mode. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Chat With Your Cards - preview</title>
    <link rel="stylesheet" href="../chat_with_your_cards/web/styles.css">
    <style>
        /* stand-ins for Anki's standard_css / css/webview.css variables */
        :root {
            --canvas: #f5f5f5;
            --canvas-elevated: #ffffff;
            --canvas-inset: #ebebeb;
            --fg: #020202;
            --fg-subtle: #737373;
            --border: #c4c4c4;
            --border-subtle: #e0e0e0;
        }
        :root.night-mode {
            --canvas: #2c2c2c;
            --canvas-elevated: #363636;
            --canvas-inset: #202020;
            --fg: #fcfcfc;
            --fg-subtle: #b0b0b0;
            --border: #4a4a4a;
            --border-subtle: #3a3a3a;
        }
        /* Anki webview.css global quirks that our styles must survive */
        * { box-sizing: content-box; }
        html { font-size: 15px; }
        body { background: var(--canvas); margin: 2em; color: var(--fg); }
        button {
            outline: none !important;
            border-radius: 5px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            padding: 8px 10px;
            margin: 0 4px;
            -webkit-appearance: none;
            cursor: pointer;
            background: #fcfcfc;
            color: var(--fg);
        }
        #preview-frame {
            width: 420px;
            height: 100vh;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div id="preview-frame"></div>
    <script>
        if (location.search.indexOf("night") !== -1) {
            document.documentElement.classList.add("night-mode");
        }

        // ---- pycmd stub: replays a scripted stream like the ScriptedBackend
        var pendingTimers = [];
        function dispatchLater(delay, payload) {
            pendingTimers.push(setTimeout(function () {
                window.chatUI.dispatch(payload);
            }, delay));
        }
        function replyStream() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            var prelude = "Let me look for related cards in your collection first.\n\n";
            prelude.split(" ").forEach(function (word) {
                dispatchLater(step(35), { type: "text_delta", text: word + " " });
            });
            dispatchLater(step(60), {
                type: "tool_call_started",
                call_id: "call-1",
                tool: "search_notes",
                summary: 'deck:current "limit"',
            });
            dispatchLater(step(900), {
                type: "tool_call_finished",
                call_id: "call-1",
                ok: true,
                summary: "12 notes",
            });
            var body = "Found **12 notes** touching on limits. The closest ones:\n\n" +
                "- *Analysis: define continuity* - continuity is a limit statement in disguise\n" +
                "- *Analysis: limit laws* - the algebra you use once limits exist\n\n" +
                "The continuity card is probably the best follow-up:\n\n" +
                "```text\nfor every epsilon > 0 there is a delta > 0 ...\n```\n\n" +
                "Want me to pull it up?";
            body.split(" ").forEach(function (word) {
                dispatchLater(step(25), { type: "text_delta", text: word + " " });
            });
            dispatchLater(step(50), { type: "done" });
        }
        // ---- proposal demo fixtures (M2) ----
        var demoCss = ".card { font-family: -apple-system, sans-serif; font-size: 18px; " +
            "text-align: center; color: #111; background: #fff; padding: 12px; }" +
            ".card.nightMode { color: #eee; background: #2c2c2c; }";
        var ledgerEntries = [];
        function proposeCreate() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            var pre = "That gap deserves its own card. Here is a proposal:\n\n";
            pre.split(" ").forEach(function (word) {
                dispatchLater(step(30), { type: "text_delta", text: word + " " });
            });
            dispatchLater(step(300), {
                type: "proposal",
                proposal: {
                    id: "p1", kind: "create", status: "pending",
                    note_type: "Basic", deck: "Math::Analysis",
                    tags: ["analysis"], note_id: null,
                    fields: [
                        { name: "Front", new: "Analysis: why does the quantifier order in the epsilon-delta definition matter?" },
                        { name: "Back", new: "Because for every epsilon there exists delta lets delta depend on epsilon. Swapping them would force f to be locally constant." },
                    ],
                    add_tags: [], remove_tags: [],
                    rationale: "You said the quantifier order was the confusing part; this isolates it as one recall step.",
                    warnings: ["deck 'Math::Analysis' does not exist yet; it will be created"],
                    previews: {
                        before: null,
                        after: {
                            question: "Analysis: why does the quantifier order matter?",
                            answer: "Analysis: why does the quantifier order matter?<hr id=answer>Because delta may depend on epsilon.",
                            css: demoCss,
                        },
                    },
                },
            });
            dispatchLater(step(200), { type: "done" });
        }
        function proposeEdit() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            dispatchLater(step(200), {
                type: "proposal",
                proposal: {
                    id: "p2", kind: "edit", status: "pending",
                    note_type: "Basic", deck: "Math::Analysis",
                    tags: ["analysis"], note_id: 1234567,
                    fields: [
                        {
                            name: "Back",
                            old: "For every epsilon there is a delta such that |x-a| < delta implies |f(x)-L| < epsilon.",
                            new: "For every epsilon > 0 there is a delta > 0 such that 0 < |x-a| < delta implies |f(x)-L| < epsilon. The puncture (0 <) excludes x = a itself.",
                        },
                    ],
                    add_tags: ["definitions"], remove_tags: ["todo"],
                    rationale: "The current back drops the positivity constraints and the puncture.",
                    warnings: [],
                    previews: {
                        before: { question: "Define the limit.", answer: "Define the limit.<hr id=answer>For every epsilon there is a delta ...", css: demoCss },
                        after: { question: "Define the limit.", answer: "Define the limit.<hr id=answer>For every epsilon > 0 there is a delta > 0 ...", css: demoCss },
                    },
                },
            });
            dispatchLater(step(200), { type: "done" });
        }
        function pushLedger() {
            window.chatUI.dispatch({
                type: "ledger",
                session_id: "demo", session_tag: "ai-chat-dock::session-demo",
                entries: ledgerEntries.slice(),
            });
        }
        window.pycmd = function (raw) {
            if (raw.indexOf("cwyc:") !== 0) { return; }
            var msg = JSON.parse(raw.slice(5));
            if (msg.type === "ready") {
                window.chatUI.ackReady();
                window.chatUI.dispatch({ type: "pins", pins: { deck: "", note_type: "", tags: [], fields: {} } });
                window.chatUI.dispatch({ type: "agent", backend: "claude", model: "", effort: "" });
            } else if (msg.type === "set_agent") {
                window.chatUI.dispatch({ type: "agent", backend: "claude", model: msg.model, effort: msg.effort });
            } else if (msg.type === "send") {
                var text = (msg.text || "").toLowerCase();
                if (text.indexOf("edit") !== -1) { proposeEdit(); }
                else if (text.indexOf("propose") !== -1 || text.indexOf("note") !== -1) { proposeCreate(); }
                else { replyStream(); }
            } else if (msg.type === "proposal_accept") {
                ledgerEntries.push({ id: msg.id, kind: "create", note_id: 424242, label: "demo note", undone: false });
                window.chatUI.dispatch({ type: "proposal_resolved", id: msg.id, status: "accepted", note_id: 424242 });
                pushLedger();
            } else if (msg.type === "proposal_reject") {
                window.chatUI.dispatch({ type: "proposal_resolved", id: msg.id, status: "rejected" });
            } else if (msg.type === "proposal_revert") {
                ledgerEntries.forEach(function (e) { if (e.id === msg.id) { e.undone = true; } });
                window.chatUI.dispatch({ type: "proposal_resolved", id: msg.id, status: "undone" });
                pushLedger();
            } else if (msg.type === "undo_session") {
                ledgerEntries.forEach(function (e) {
                    if (!e.undone) {
                        e.undone = true;
                        window.chatUI.dispatch({ type: "proposal_resolved", id: e.id, status: "undone" });
                    }
                });
                pushLedger();
            } else if (msg.type === "set_pins") {
                window.chatUI.dispatch({ type: "pins", pins: msg.pins });
            } else if (msg.type === "cancel") {
                pendingTimers.forEach(clearTimeout);
                pendingTimers = [];
                window.chatUI.dispatch({ type: "cancelled" });
            } else if (msg.type === "new_chat") {
                pendingTimers.forEach(clearTimeout);
                pendingTimers = [];
                ledgerEntries = [];
                window.chatUI.dispatch({ type: "reset" });
            }
        };
    </script>
    <script src="../chat_with_your_cards/web/vendor/marked.min.js"></script>
    <script>
        fetch("../chat_with_your_cards/web/index.html")
            .then(function (r) { return r.text(); })
            .then(function (html) {
                document.getElementById("preview-frame").innerHTML = html;
                var s = document.createElement("script");
                s.src = "../chat_with_your_cards/web/app.js";
                document.body.appendChild(s);
            });
    </script>
</body>
</html>
