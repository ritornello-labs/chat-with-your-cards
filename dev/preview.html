<!doctype html>
<!-- Browser preview harness for the chat dock web UI.

     Loads the real web assets with a stubbed pycmd that replays a canned
     event stream, so CSS/JS can be iterated in a plain browser without a
     disposable Anki. Serve the repo root (e.g. python3 -m http.server) and
     open /dev/preview.html; add ?night for dark mode. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Chat With Your Cards - preview</title>
    <link rel="stylesheet" href="../chat_with_your_cards/web/styles.css">
    <style>
        /* stand-ins for Anki's standard_css / css/webview.css variables */
        :root {
            --canvas: #f5f5f5;
            --canvas-elevated: #ffffff;
            --canvas-inset: #ebebeb;
            --fg: #020202;
            --fg-subtle: #737373;
            --border: #c4c4c4;
            --border-subtle: #e0e0e0;
        }
        :root.night-mode {
            --canvas: #2c2c2c;
            --canvas-elevated: #363636;
            --canvas-inset: #202020;
            --fg: #fcfcfc;
            --fg-subtle: #b0b0b0;
            --border: #4a4a4a;
            --border-subtle: #3a3a3a;
        }
        /* Anki webview.css global quirks that our styles must survive */
        * { box-sizing: content-box; }
        html { font-size: 15px; }
        body { background: var(--canvas); margin: 2em; color: var(--fg); }
        button {
            outline: none !important;
            border-radius: 5px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            padding: 8px 10px;
            margin: 0 4px;
            -webkit-appearance: none;
            cursor: pointer;
            background: #fcfcfc;
            color: var(--fg);
        }
        #preview-frame {
            width: 420px;
            height: 100vh;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div id="preview-frame"></div>
    <script>
        if (location.search.indexOf("night") !== -1) {
            document.documentElement.classList.add("night-mode");
        }

        // ---- pycmd stub: replays a scripted stream like the ScriptedBackend
        var pendingTimers = [];
        function dispatchLater(delay, payload) {
            pendingTimers.push(setTimeout(function () {
                window.chatUI.dispatch(payload);
            }, delay));
        }
        function replyStream() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            var prelude = "Let me look for related cards in your collection first.\n\n";
            prelude.split(" ").forEach(function (word) {
                dispatchLater(step(35), { type: "text_delta", text: word + " " });
            });
            // A hidden internal tool (ToolSearch) must render nothing.
            dispatchLater(step(40), {
                type: "tool_call_started", call_id: "call-0",
                tool: "ToolSearch", summary: '{"query":"select:search_notes"}',
            });
            dispatchLater(step(80), { type: "tool_call_finished", call_id: "call-0", ok: true });
            dispatchLater(step(60), {
                type: "tool_call_started",
                call_id: "call-1",
                tool: "mcp__anki__search_notes",
                summary: '{"query":"deck:current \\"limit\\""}',
            });
            dispatchLater(step(900), {
                type: "tool_call_finished",
                call_id: "call-1",
                ok: true,
                summary: '{"total":12}',
            });
            var body = "Found **12 notes** touching on limits. The closest ones:\n\n" +
                "- *Analysis: define continuity* - continuity is a limit statement in disguise\n" +
                "- *Analysis: limit laws* - the algebra you use once limits exist\n\n" +
                "The continuity card is probably the best follow-up:\n\n" +
                "```text\nfor every epsilon > 0 there is a delta > 0 ...\n```\n\n" +
                "Want me to pull it up?";
            body.split(" ").forEach(function (word) {
                dispatchLater(step(25), { type: "text_delta", text: word + " " });
            });
            dispatchLater(step(30), { type: "usage", cost_usd: 0.042, input_tokens: 12000, output_tokens: 450 });
            dispatchLater(step(50), { type: "done" });
        }
        // ---- proposal demo fixtures (M2) ----
        var demoCss = ".card { font-family: -apple-system, sans-serif; font-size: 18px; " +
            "text-align: center; color: #111; background: #fff; padding: 12px; }" +
            ".card.nightMode { color: #eee; background: #2c2c2c; }";
        var ledgerEntries = [];
        var demoProposals = {}; // id -> payload, so restore/re-add can re-dispatch
        function createProposal(id, front, back) {
            return {
                id: id, kind: "create", status: "pending",
                note_type: "Basic", deck: "Math::Analysis",
                tags: ["analysis"], note_id: null,
                fields: [{ name: "Front", new: front }, { name: "Back", new: back }],
                add_tags: [], remove_tags: [],
                rationale: "Isolates a single confusing point as one recall step.",
                warnings: ["deck 'Math::Analysis' does not exist yet; it will be created"],
                previews: {
                    before: null,
                    after: {
                        question: front,
                        answer: front + "<hr id=answer>" + back,
                        css: demoCss,
                    },
                },
            };
        }
        function emitProposal(delay, payload) {
            demoProposals[payload.id] = payload;
            dispatchLater(delay, { type: "proposal", proposal: payload });
        }
        function proposeCreate() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            var pre = "Those gaps each deserve a card. Here are two proposals:\n\n";
            pre.split(" ").forEach(function (word) {
                dispatchLater(step(30), { type: "text_delta", text: word + " " });
            });
            emitProposal(step(300), createProposal("p1",
                "Analysis: why does the quantifier order in the epsilon-delta definition matter?",
                "Because for every epsilon there exists delta lets delta depend on epsilon."));
            emitProposal(step(150), createProposal("p1b",
                "Analysis: what does the puncture 0 < |x-a| exclude?",
                "It excludes x = a itself, so f need not even be defined at a."));
            dispatchLater(step(200), { type: "done" });
        }
        function proposeRevision() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            "Good point — here is a shorter version:".split(" ").forEach(function (w) {
                dispatchLater(step(30), { type: "text_delta", text: w + " " });
            });
            // Supersede the first proposal in favor of the revision.
            dispatchLater(step(200), { type: "proposal_resolved", id: "p1", status: "superseded" });
            emitProposal(step(150), createProposal("p2rev",
                "Analysis: why does epsilon-delta quantifier order matter?",
                "So delta may depend on epsilon."));
            dispatchLater(step(200), { type: "done" });
        }
        function proposeEdit() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            emitProposal(step(200), {
                    id: "p2", kind: "edit", status: "pending",
                    note_type: "Basic", deck: "Math::Analysis",
                    tags: ["analysis"], note_id: 1234567,
                    fields: [
                        {
                            name: "Back",
                            old: "For every epsilon there is a delta such that |x-a| < delta implies |f(x)-L| < epsilon.",
                            new: "For every epsilon > 0 there is a delta > 0 such that 0 < |x-a| < delta implies |f(x)-L| < epsilon. The puncture (0 <) excludes x = a itself.",
                        },
                    ],
                    add_tags: ["definitions"], remove_tags: ["todo"],
                    rationale: "The current back drops the positivity constraints and the puncture.",
                    warnings: [],
                    previews: {
                        before: { question: "Define the limit.", answer: "Define the limit.<hr id=answer>For every epsilon there is a delta ...", css: demoCss },
                        after: { question: "Define the limit.", answer: "Define the limit.<hr id=answer>For every epsilon > 0 there is a delta > 0 ...", css: demoCss },
                    },
            });
            dispatchLater(step(200), { type: "done" });
        }
        function proposeBulk() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            emitProposal(step(200), {
                id: "b1", kind: "bulk", op: "rename_tag",
                op_args: { old_tag: "todo", new_tag: "review-later" },
                status: "pending", note_type: "", deck: "", tags: [],
                fields: [], add_tags: [], remove_tags: [], items: [], open: false,
                rationale: "Consolidates the todo tag into your naming scheme.",
                count: 1243, samples: [{ text: "todo → review-later" }],
                warnings: [], previews: null, note_id: null, title: "",
            });
            emitProposal(step(200), {
                id: "d1", kind: "delete", op: "", op_args: { note_ids: [1, 2, 3] },
                status: "pending", note_type: "", deck: "", tags: [],
                fields: [], add_tags: [], remove_tags: [], items: [], open: false,
                rationale: "These three notes duplicate the new cloze cards.",
                count: 3,
                samples: [{ text: "What is a limit?" }, { text: "Define limit (dup)" }],
                warnings: ["Deleting notes cannot be undone from the chat ledger. A backup checkpoint is created first."],
                previews: null, note_id: null, title: "",
            });
            dispatchLater(step(150), { type: "done" });
        }
        function proposeChangeSet() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            var cs = {
                id: "cs1", kind: "change_set", op: "", op_args: {},
                status: "pending", note_type: "", deck: "", tags: [],
                fields: [], add_tags: [], remove_tags: [], open: true,
                rationale: "Normalizing pinyin tone marks across the deck.",
                count: 0, samples: [], items: [], previews: null, note_id: null,
                title: "Fix pinyin tone marks",
            };
            emitProposal(step(200), cs);
            dispatchLater(step(700), { type: "proposal", proposal: Object.assign({}, cs, { count: 2, items: [
                { note_id: 11, label: "niao niao", fields: ["Pinyin"] },
                { note_id: 12, label: "ma shang", fields: ["Pinyin"] },
            ] }) });
            dispatchLater(step(900), { type: "proposal", proposal: Object.assign({}, cs, {
                open: false, count: 214,
                samples: [
                    { label: "niao niao", old: "niao3 niao3", new: "niǎo niǎo" },
                    { label: "ma shang", old: "ma3 shang4", new: "mǎ shàng" },
                ],
                items: Array.from({length: 214}, function (_, i) {
                    return { note_id: 100 + i, label: "note " + (100 + i), fields: ["Pinyin"] };
                }),
            }) });
            dispatchLater(step(150), { type: "done" });
        }
        function proposeDeckOps() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            emitProposal(step(200), {
                id: "dk1", kind: "deck_op", op: "set_deck_options",
                op_args: { deck: "Math::Analysis", options: { "new.perDay": 40, "rev.perDay": 300 } },
                status: "pending", note_type: "", deck: "Math::Analysis", tags: [],
                fields: [], add_tags: [], remove_tags: [], items: [], open: false,
                rationale: "You asked to get through the backlog faster this month.",
                count: 2,
                samples: [
                    { text: "new.perDay: 20 → 40" },
                    { text: "rev.perDay: 200 → 300" },
                ],
                warnings: ['options preset "Default" is shared by 4 decks - changes affect all of them'],
                previews: null, note_id: null, title: "",
            });
            emitProposal(step(250), {
                id: "dk2", kind: "deck_op", op: "create_filtered_deck",
                op_args: { name: "Cram::Analysis due", terms: [["deck:\"Math::Analysis\" is:due", 100, 6]], resched: true },
                status: "pending", note_type: "", deck: "Cram::Analysis due", tags: [],
                fields: [], add_tags: [], remove_tags: [], items: [], open: false,
                rationale: "A focused session over everything due in Analysis.",
                count: 0,
                samples: [
                    { text: 'Create filtered deck "Cram::Analysis due"' },
                    { text: 'Gather: deck:"Math::Analysis" is:due (limit 100, order due) — ≈57 card(s) match now' },
                    { text: "Reviews reschedule cards normally" },
                ],
                warnings: [], previews: null, note_id: null, title: "",
            });
            dispatchLater(step(150), { type: "done" });
        }
        function proposeSkillUpdate() {
            var t = 0;
            var step = function (ms) { t += ms; return t; };
            var pre = "I looked across your 12 edits. Three patterns are consistent:\n\n";
            pre.split(" ").forEach(function (w) {
                dispatchLater(step(25), { type: "text_delta", text: w + " " });
            });
            var payload = {
                id: "sk1", kind: "skill_update", status: "pending",
                note_type: "", deck: "", tags: [], note_id: null, fields: [],
                add_tags: [], remove_tags: [], warnings: [],
                title: "Update the card-authoring skill",
                rationale: "Teach the skill to keep answers to one line and stop bolding whole phrases.",
                count: 12,
                samples: [
                    { text: "You shortened 7 answers to a single line, moving detail to the back-context field." },
                    { text: "You removed <b> from full phrases 5 times, keeping it only on the key term." },
                    { text: "You deleted both cards that asked yes/no questions." },
                ],
                op_args: { diff: "--- skill (current)\n+++ skill (proposed)\n@@ -12,7 +12,8 @@\n-- **Answers are short.** Lead with the core answer; push nice-to-know\n-  context into the note's extra/back-context field, visually secondary.\n+- **Answers are ONE line.** Lead with the core answer only; everything\n+  else goes to the extra/back-context field, visually secondary.\n+- Bold ONLY the single key term, never a whole phrase.\n" },
                items: [], open: false,
            };
            demoProposals.sk1 = payload;
            dispatchLater(step(400), { type: "proposal", proposal: payload });
            dispatchLater(step(150), { type: "done" });
        }
        function pushLedger() {
            window.chatUI.dispatch({
                type: "ledger",
                session_id: "demo", session_tag: "ai-chat-dock::session-demo",
                entries: ledgerEntries.slice(),
            });
        }
        window.pycmd = function (raw) {
            if (raw.indexOf("cwyc:") !== 0) { return; }
            var msg = JSON.parse(raw.slice(5));
            if (msg.type === "ready") {
                window.chatUI.ackReady();
                window.chatUI.dispatch({ type: "collection_meta",
                    decks: ["Default", "Math::Analysis", "Math::Algebra", "Spanish::Verbs"],
                    note_types: [
                        { name: "Basic", fields: ["Front", "Back"] },
                        { name: "Cloze", fields: ["Text", "Back Extra"] },
                        { name: "Pokemon", fields: ["Name", "Image", "Types", "Dex"] }
                    ],
                    tags: ["analysis", "definitions", "todo", "pokemon", "spanish"] });
                window.chatUI.dispatch({ type: "pins", pins: { deck: "", note_type: "", tags: [], fields: {} } });
                window.chatUI.dispatch({ type: "agent", backend: "claude", model: "", effort: "", mode: "default" });
                window.chatUI.dispatch({ type: "dock_state", floating: false });
                window.chatUI.dispatch({ type: "learning", pending: 12, nudge: true });
            } else if (msg.type === "start_skill_review") {
                window.chatUI.dispatch({ type: "reset" });
                window.chatUI.dispatch({ type: "learning", pending: 12, nudge: false });
                window.chatUI.dispatch({ type: "user_message",
                    text: "I've been editing the cards you created or changed. Review my edits and propose a skill update." });
                proposeSkillUpdate();
            } else if (msg.type === "toggle_float") {
                window.__floating = !window.__floating;
                window.chatUI.dispatch({ type: "dock_state", floating: window.__floating });
            } else if (msg.type === "tool_approval_response") {
                window.chatUI.dispatch({ type: "tool_approval_resolved", id: msg.id, allow: msg.allow });
            } else if (msg.type === "open_in_claude") {
                window.chatUI.dispatch({ type: "notice", text: "would open in " + msg.target });
            } else if (msg.type === "run_doctor") {
                window.chatUI.dispatch({ type: "doctor", results: [
                    { label: "Claude Code", status: "ok", detail: "2.1.197 — /Users/x/.local/bin/claude" },
                    { label: "Codex CLI (future backend)", status: "broken", detail: "codex exists but --version failed: ENOENT", link: "https://developers.openai.com/codex/cli/" },
                    { label: "Pi (future backend)", status: "missing", detail: "not found on PATH", link: "https://pi.dev/" },
                    { label: "Permission mode", status: "ok", detail: "default, web access on" },
                ] });
            } else if (msg.type === "list_history") {
                window.chatUI.dispatch({ type: "history", sessions: [
                    { id: "h1", title: "Explain this card to me — I forgot", updated_at: Date.now()/1000 - 3600, events: 12 },
                    { id: "h2", title: "Propose cards about the Twelve", updated_at: Date.now()/1000 - 90000, events: 31 },
                ] });
            } else if (msg.type === "load_history") {
                window.chatUI.dispatch({ type: "reset" });
                window.chatUI.dispatch({ type: "history_load", events: [
                    { type: "user_message", text: "Explain this card to me — I forgot" },
                    { type: "assistant_text", text: "It is about the **epsilon-delta** definition." },
                    { type: "tool_call_started", call_id: "h-1", tool: "mcp__anki__search_notes", summary: '{"query":"limit"}' },
                    { type: "tool_call_finished", call_id: "h-1", ok: true },
                    { type: "proposal", proposal: createProposal("hp1", "Old pending proposal?", "From a previous session.") },
                    { type: "usage", cost_usd: 0.12, input_tokens: 30000, output_tokens: 2000 },
                ] });
            } else if (msg.type === "set_permission_mode") {
                window.chatUI.dispatch({ type: "agent", backend: "claude", model: "", effort: "", mode: msg.mode });
            } else if (msg.type === "set_agent") {
                window.chatUI.dispatch({ type: "agent", backend: "claude", model: msg.model, effort: msg.effort, mode: "default" });
            } else if (msg.type === "send") {
                var text = (msg.text || "").toLowerCase();
                if (text.indexOf("approval") !== -1) {
                    dispatchLater(200, { type: "tool_approval", id: "ap1",
                        tool: "mcp__anki__search_notes", summary: '{"query":"deck:current"}' });
                    dispatchLater(400, { type: "done" });
                }
                else if (text.indexOf("deck") !== -1) { proposeDeckOps(); }
                else if (text.indexOf("bulk") !== -1) { proposeBulk(); }
                else if (text.indexOf("sweep") !== -1 || text.indexOf("change set") !== -1) { proposeChangeSet(); }
                else if (text.indexOf("shorter") !== -1 || text.indexOf("revise") !== -1 || text.indexOf("please") !== -1) { proposeRevision(); }
                else if (text.indexOf("edit") !== -1) { proposeEdit(); }
                else if (text.indexOf("propose") !== -1 || text.indexOf("note") !== -1) { proposeCreate(); }
                else { replyStream(); }
            } else if (msg.type === "proposal_preview") {
                // Echo a live-updated preview reflecting the edited fields.
                var f = msg.fields || {};
                var front = f.Front !== undefined ? f.Front : (f.Text || "(front)");
                var back = f.Back !== undefined ? f.Back : (f["Back Extra"] || "");
                window.chatUI.dispatch({ type: "preview_update", id: msg.id, previews: {
                    before: null,
                    after: { question: front, answer: front + "<hr id=answer>" + back, css: demoCss },
                } });
            } else if (msg.type === "proposal_accept") {
                if (demoProposals[msg.id] && demoProposals[msg.id].kind === "skill_update") {
                    window.chatUI.dispatch({ type: "proposal_resolved", id: msg.id, status: "accepted",
                        revertible: false,
                        warnings: ["Previous skill version archived as user_files/learning/skill-backups/SKILL-1751700000.md"] });
                    window.chatUI.dispatch({ type: "learning", pending: 0, nudge: false });
                    return;
                }
                ledgerEntries.push({ id: msg.id, kind: "create", note_id: 424242, label: "demo note", undone: false });
                window.chatUI.dispatch({ type: "proposal_resolved", id: msg.id, status: "accepted", note_id: 424242 });
                pushLedger();
            } else if (msg.type === "proposal_reject") {
                window.chatUI.dispatch({ type: "proposal_resolved", id: msg.id, status: "rejected" });
            } else if (msg.type === "proposal_readd") {
                ledgerEntries.push({ id: msg.id, kind: "create", note_id: 424243, label: "demo note", undone: false });
                window.chatUI.dispatch({ type: "proposal_resolved", id: msg.id, status: "accepted", note_id: 424243 });
                pushLedger();
            } else if (msg.type === "proposal_restore") {
                var p = demoProposals[msg.id];
                if (p) { p.status = "pending"; window.chatUI.dispatch({ type: "proposal", proposal: p }); }
            } else if (msg.type === "proposal_revert") {
                ledgerEntries.forEach(function (e) { if (e.id === msg.id) { e.undone = true; } });
                window.chatUI.dispatch({ type: "proposal_resolved", id: msg.id, status: "undone" });
                pushLedger();
            } else if (msg.type === "undo_session") {
                ledgerEntries.forEach(function (e) {
                    if (!e.undone) {
                        e.undone = true;
                        window.chatUI.dispatch({ type: "proposal_resolved", id: e.id, status: "undone" });
                    }
                });
                pushLedger();
            } else if (msg.type === "set_pins") {
                window.chatUI.dispatch({ type: "pins", pins: msg.pins });
            } else if (msg.type === "cancel") {
                pendingTimers.forEach(clearTimeout);
                pendingTimers = [];
                window.chatUI.dispatch({ type: "cancelled" });
            } else if (msg.type === "new_chat") {
                pendingTimers.forEach(clearTimeout);
                pendingTimers = [];
                ledgerEntries = [];
                window.chatUI.dispatch({ type: "reset" });
            }
        };
    </script>
    <script src="../chat_with_your_cards/web/vendor/marked.min.js"></script>
    <script>
        fetch("../chat_with_your_cards/web/index.html")
            .then(function (r) { return r.text(); })
            .then(function (html) {
                document.getElementById("preview-frame").innerHTML = html;
                var s = document.createElement("script");
                s.src = "../chat_with_your_cards/web/app.js";
                document.body.appendChild(s);
            });
    </script>
</body>
</html>
