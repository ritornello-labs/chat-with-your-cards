[project]
name = "chat-with-your-cards"
version = "0.1.0"
description = "Anki add-on: a collapsible AI chat dock for talking to your collection."
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "anki-addon-workbench[gui]>=0.4.2",
    "mypy>=1.13.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"
# First-party package: allow fresh releases despite the 7-day age gate.
exclude-newer-package = { anki-addon-workbench = "2026-07-04" }

[tool.uv.pip]
exclude-newer = "7 days"

[tool.anki-addon-release]
source_dir = "chat_with_your_cards"
manifest = "chat_with_your_cards/manifest.json"
artifact_dir = "dist"
artifact_name = "chat-with-your-cards.ankiaddon"
include = ["*.py", "manifest.json", "config.json", "config.md", "_vendor", "backends", "tools", "web"]
exclude = ["__pycache__", "*.pyc", "user_files"]

[tool.anki-addon-release.ankiweb]
addon_id = "1873801775"
listing_file = "release/ankiweb.md"
changelog_file = "CHANGELOG.md"
login_email_env = "ANKIWEB_EMAIL"
login_password_env = "ANKIWEB_PASSWORD"

[tool.anki-addon-workbench]
project_name = "Chat With Your Cards"
addon_package = "chat_with_your_cards"
source_root = "chat_with_your_cards"
include = [
    "__init__.py",
    "manifest.json",
    "config.json",
    "config.md",
    "dock.py",
    "bridge.py",
    "controller.py",
    "shortcuts.py",
    "context.py",
    "approvals.py",
    "search_terms.py",
    "deferral.py",
    "doctor.py",
    "transcripts.py",
    "proposals.py",
    "preview_window.py",
    "media_staging.py",
    "contract.py",
    "invariants.py",
    "grading.py",
    "_vendor",
    "learning.py",
    "skills.py",
    "stats.py",
    "mcp_server.py",
    "backends",
    "tools",
    "web",
]
exclude = ["__pycache__", "user_files"]
probe_addon = "tests/gui_smoke/probe_addon"
probe_package = "zz_chat_with_your_cards_probe"
anki_version = "25.09"
profile = "User 1"
docker_image = "chat-with-your-cards-anki-gui"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
explicit_package_bases = true
