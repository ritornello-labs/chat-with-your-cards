<div id="cwyc-root">
    <header id="cwyc-header">
        <button id="cwyc-new-chat" type="button" title="New chat (Ctrl+Shift+J)">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8"
                      stroke-linecap="round" fill="none"/>
            </svg>
            New chat
        </button>
        <span id="cwyc-header-spacer"></span>
        <button id="cwyc-agent-toggle" type="button"
                title="Choose the model and effort level">
            <span id="cwyc-agent-label">Model</span>
            <svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">
                <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6"
                      stroke-linecap="round" fill="none"/>
            </svg>
        </button>
        <button id="cwyc-pins-toggle" type="button"
                title="Defaults the assistant reuses for every note it proposes">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                <path d="M9.5 1.5l5 5-2.2.7-2.5 2.5.4 3.3-1.6-1.6L4 15l-3-3 3.6-4.6L3 5.8l1.6-1.6 3.3.4 2.5-2.5z"
                      fill="currentColor" opacity="0.85"/>
            </svg>
            <span id="cwyc-pins-label">Pins</span>
        </button>
    </header>
    <section id="cwyc-agent-panel" hidden>
        <div class="cwyc-agent-row">
            <label for="cwyc-agent-model">Model</label>
            <select id="cwyc-agent-model">
                <option value="">CLI default</option>
                <option value="fable">Fable (most capable)</option>
                <option value="opus">Opus</option>
                <option value="sonnet">Sonnet</option>
                <option value="haiku">Haiku (fastest)</option>
            </select>
        </div>
        <div class="cwyc-agent-row">
            <label for="cwyc-agent-effort">Effort</label>
            <select id="cwyc-agent-effort">
                <option value="">CLI default</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="xhigh">Extra high</option>
                <option value="max">Max</option>
            </select>
        </div>
        <div class="cwyc-agent-hint">
            Switch anytime — the current chat continues under the new model.
        </div>
    </section>
    <section id="cwyc-pins-panel" hidden>
        <p class="cwyc-pins-intro">
            Pins are defaults the assistant reuses for every note it proposes —
            deck, note type, tags, and field values — until you change them.
        </p>
        <div class="cwyc-pins-row">
            <label for="cwyc-pin-deck">Deck</label>
            <select id="cwyc-pin-deck">
                <option value="">— none —</option>
            </select>
        </div>
        <div class="cwyc-pins-row">
            <label for="cwyc-pin-notetype">Note type</label>
            <select id="cwyc-pin-notetype">
                <option value="">— none —</option>
            </select>
        </div>
        <div class="cwyc-pins-row">
            <label for="cwyc-pin-tags">Tags</label>
            <input id="cwyc-pin-tags" type="text" placeholder="comma-separated"
                   autocomplete="off" list="cwyc-tag-options">
            <datalist id="cwyc-tag-options"></datalist>
        </div>
        <div id="cwyc-pin-fields-wrap">
            <div class="cwyc-pins-fields-label">Field defaults</div>
            <div id="cwyc-pin-fields"></div>
            <div class="cwyc-pins-hint" id="cwyc-pin-fields-empty">
                Pick a note type to set default field values.
            </div>
        </div>
        <div class="cwyc-pins-actions">
            <span class="cwyc-pins-spacer"></span>
            <button id="cwyc-pins-clear" type="button">Clear</button>
            <button id="cwyc-pins-save" type="button" class="cwyc-primary">Save pins</button>
        </div>
    </section>
    <main id="cwyc-transcript" aria-live="polite"></main>
    <footer id="cwyc-footer">
        <div id="cwyc-ledger" hidden>
            <span id="cwyc-ledger-label"></span>
            <button id="cwyc-ledger-browser" type="button"
                    title="Show this session's AI-created notes in the Browser">Browser</button>
            <button id="cwyc-ledger-undo" type="button"
                    title="Revert every change made this session">Undo session</button>
        </div>
        <div id="cwyc-context-chip" title="What the assistant will see">
            Context: collection overview
        </div>
        <div id="cwyc-composer">
            <textarea id="cwyc-input" rows="1" placeholder="Ask about this card&hellip;"
                      autocomplete="off"></textarea>
            <button id="cwyc-send" type="button" title="Send (Enter)" aria-label="Send">
                <svg class="cwyc-icon-send" viewBox="0 0 16 16" width="16" height="16"
                     aria-hidden="true">
                    <path d="M8 13V3M4 7l4-4 4 4" stroke="currentColor" stroke-width="1.8"
                          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
                <svg class="cwyc-icon-stop" viewBox="0 0 16 16" width="16" height="16"
                     aria-hidden="true">
                    <rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </footer>
</div>
